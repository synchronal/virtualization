[package]
categories.workspace = true
description = "FFI to Apple's AccessoryAccess framework, through swift-bridge. Use the `accessory-access` crate instead."
edition.workspace = true
keywords.workspace = true
license.workspace = true
links = "AccessoryAccessBridge"
name = "accessory-access-sys"
repository.workspace = true
rust-version.workspace = true
version = "0.1.1"

# The Swift package is an input to the build script, not a cargo target, so it
# ships whole. Naming the sources keeps the tarball the same whatever is lying
# around a working tree.
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/build.rs",
  "/src/**/*.rs",
  "/swift/Package.swift",
  "/swift/Sources/**/*.h",
  "/swift/Sources/**/*.swift",
]

[dependencies]
apple-bridge-foundation.workspace = true
dispatch2.workspace = true
io-usb-host-sys.workspace = true
swift-bridge.workspace = true

[build-dependencies]
apple-bridge-build.workspace = true
