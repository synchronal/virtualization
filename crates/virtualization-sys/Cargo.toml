[package]
categories.workspace = true
description = "FFI to Apple's Virtualization framework, through swift-bridge. Use the `virtualization` crate instead."
edition.workspace = true
keywords.workspace = true
license.workspace = true
links = "VirtualizationBridge"
name = "virtualization-sys"
repository.workspace = true
rust-version.workspace = true
version = "0.1.1"

# The Swift package is an input to the build script, not a cargo target, so it
# ships whole. Naming the sources keeps the tarball the same whatever is lying
# around a working tree.
include = [
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/build.rs",
  "/src/**/*.rs",
  "/swift/Package.swift",
  "/swift/Sources/**/*.h",
  "/swift/Sources/**/*.swift",
]

[dependencies]
accessory-access-sys.workspace = true
apple-bridge-foundation.workspace = true
disk-image-kit-sys.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation = { workspace = true, features = ["NSZone"] }
swift-bridge.workspace = true
vmnet-framework-sys.workspace = true

[build-dependencies]
apple-bridge-build.workspace = true
