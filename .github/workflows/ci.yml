# The checks medic's `audit` and `test` run. Jobs split where each needs its
# own build anyway (clippy, unit tests) or none at all. medic's
# `cargo check --workspace` is left out: clippy builds the same. So are the
# integration suites: GitHub's macOS runners are virtual machines, where
# Virtualization is "not available on this hardware".

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain and targets come from rust-toolchain.toml.
      - run: rustup toolchain install && rustup component add rustfmt
      - run: cargo fmt --all --check

  swift-format:
    # macOS 27 with Xcode 27, whose swift-format bin/dev's scripts find on PATH.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: dirname "$(xcrun --find swift-format)" >>"$GITHUB_PATH"
      - name: format
        run: bin/dev/format-swift --check
      - name: lint
        run: bin/dev/lint-swift

  clippy:
    # The Swift packages need the macOS 27 SDK.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install && rustup component add clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  unit-tests:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo nextest run

  linux-check:
    # The safe crates compile off macOS, with every call unsupported.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: >-
          cargo check --target x86_64-unknown-linux-gnu --all-targets
          -p accessory-access
          -p apple-bridge-foundation
          -p disk-image-kit
          -p io-usb-host
          -p virtualization
          -p vmnet-framework

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
