experimental = ["setup-scripts"]

# Downloads the kernel the booting suites start, and tells them where it is.
[scripts.setup.prepare-integration]
command = { command-line = "bin/dev/prepare-integration", relative-to = "workspace-root" }
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.scripts]]
filter = 'binary(virtual_machine) | binary(virtio_block_device_configuration) | binary(disk_image_storage_device_attachment) | binary(virtio_network_device_configuration) | binary(network_device) | binary(virtio_file_system_device_configuration) | binary(virtio_file_system_device) | binary(virtio_entropy_device_configuration) | binary(virtio_traditional_memory_balloon_device)'
setup = 'prepare-integration'

# A VM per test: too many at once starves the guests, and a starved guest
# looks like a hang.
[test-groups]
machines = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(virtual_machine) | binary(virtio_block_device_configuration) | binary(disk_image_storage_device_attachment) | binary(virtio_network_device_configuration) | binary(network_device) | binary(virtio_file_system_device_configuration) | binary(virtio_file_system_device) | binary(virtio_entropy_device_configuration) | binary(virtio_traditional_memory_balloon_device)'
test-group = 'machines'
slow-timeout = { period = "30s", terminate-after = 2 }
