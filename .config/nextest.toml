experimental = ["setup-scripts"]

# Under booting guests' load, a test's output can close more than nextest's
# default 100ms after it exits. A real leak (a process holding it open)
# still outlasts 1s.
[profile.default]
leak-timeout = "1s"

# Downloads the kernel the booting suites start, and tells them where it is.
[scripts.setup.prepare-integration]
command = { command-line = "bin/dev/prepare-integration", relative-to = "workspace-root" }
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.scripts]]
filter = 'binary(virtual_machine) | binary(virtio_block_device_configuration) | binary(disk_image_storage_device_attachment) | binary(virtio_network_device_configuration) | binary(network_device) | binary(virtio_file_system_device_configuration) | binary(virtio_file_system_device) | binary(virtio_entropy_device_configuration) | binary(virtio_traditional_memory_balloon_device) | binary(virtio_console_device_configuration) | binary(virtio_console_device) | binary(virtio_console_port) | binary(virtio_socket_device_configuration) | binary(virtio_socket_device) | binary(virtio_socket_listener) | binary(virtio_socket_connection) | binary(nvm_express_controller_device_configuration) | binary(disk_block_device_storage_device_attachment) | binary(network_block_device_storage_device_attachment) | binary(xhci_controller) | binary(usb_mass_storage_device)'
setup = 'prepare-integration'

# A VM per test: too many at once starves the guests, and a starved guest
# looks like a hang.
[test-groups]
machines = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'binary(virtual_machine) | binary(virtio_block_device_configuration) | binary(disk_image_storage_device_attachment) | binary(virtio_network_device_configuration) | binary(network_device) | binary(virtio_file_system_device_configuration) | binary(virtio_file_system_device) | binary(virtio_entropy_device_configuration) | binary(virtio_traditional_memory_balloon_device) | binary(virtio_console_device_configuration) | binary(virtio_console_device) | binary(virtio_console_port) | binary(virtio_socket_device_configuration) | binary(virtio_socket_device) | binary(virtio_socket_listener) | binary(virtio_socket_connection) | binary(efi_boot_loader) | binary(nvm_express_controller_device_configuration) | binary(disk_block_device_storage_device_attachment) | binary(network_block_device_storage_device_attachment) | binary(xhci_controller) | binary(usb_mass_storage_device)'
test-group = 'machines'
slow-timeout = { period = "30s", terminate-after = 2 }
