[claude]
seed_from_keychain = true

[container]
cpus = 4
env = []
memory = "2G"

[host]
clipboard = true

[host.commands.audit]
argv = ["cargo", "audit"]

[host.commands.check]
argv = ["cargo", "check", "--workspace", "--all-targets"]

[host.commands.check-linux]
argv = ["cargo", "check", "--target", "x86_64-unknown-linux-gnu", "-p", "accessory-access", "-p", "disk-image-kit", "-p", "foundation-sys", "-p", "io-usb-host", "-p", "virtualization", "-p", "vmnet", "--all-targets"]

[host.commands.clippy]
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--all-features", "--", "-D", "warnings"]

[host.commands.fmt]
argv = ["cargo", "fmt", "--all"]

[host.commands.swift-fmt]
argv = ["bin/dev/format-swift", "--all"]

# Takes a module name; the script refuses anything else.
[host.commands.swift-interface]
arguments = true
argv = ["bin/dev/swift-interface"]

[host.commands.swift-lint]
argv = ["bin/dev/lint-swift"]

# Exact: no arguments, the whole suite.
[host.commands.test]
argv = ["cargo", "nextest", "run"]
tty = true

[host.commands.test-integration]
argv = ["bin/dev/test-integration"]
tty = true

# Widened deliberately, for the iterate-on-one-failing-test loop.
[host.commands.test-one]
arguments = true
argv = ["cargo", "nextest", "run"]
deny = ["--config", "--manifest-path", "-Z", "-p"]
tty = true

[project]
image = "compostbin/base:latest"
name = "vz"

[workspace]
roots = []
