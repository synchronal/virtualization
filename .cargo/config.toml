# The Swift runtime virtualization-sys links against is dynamic and referenced
# through `@rpath`, so every binary that links it — including this workspace's
# own test binaries — needs this rpath or dies in dyld at launch. A rustflag is
# the one mechanism that reaches every kind of target.
#
# This file covers builds of this repository only. A crate depending on
# `virtualization` needs the same rustflag in its own `.cargo/config.toml`.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
