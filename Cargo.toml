[workspace.package]
categories = ["api-bindings", "os::macos-apis", "virtualization"]
edition = "2024"
keywords = ["virtualization", "macos", "vm", "hypervisor"]
license = "MIT"
repository = "https://github.com/synchronal/virtualization"
rust-version = "1.98"
version = "0.1.0"

[workspace]
members = [
  "crates/accessory-access",
  "crates/accessory-access-sys",
  "crates/apple-bridge-build",
  "crates/apple-bridge-foundation",
  "crates/disk-image-kit",
  "crates/disk-image-kit-sys",
  "crates/io-usb-host",
  "crates/io-usb-host-sys",
  "crates/virtualization",
  "crates/virtualization-sys",
  "crates/virtualization-test",
  "crates/vmnet-framework",
  "crates/vmnet-framework-sys",
]
# The integration suites run only signed, through bin/dev/test-integration.
default-members = [
  "crates/accessory-access",
  "crates/accessory-access-sys",
  "crates/apple-bridge-build",
  "crates/apple-bridge-foundation",
  "crates/disk-image-kit",
  "crates/disk-image-kit-sys",
  "crates/io-usb-host",
  "crates/io-usb-host-sys",
  "crates/virtualization",
  "crates/virtualization-sys",
  "crates/vmnet-framework",
  "crates/vmnet-framework-sys",
]
resolver = "3"

[workspace.dependencies]
accessory-access = { path = "crates/accessory-access", version = "0.1.0" }
accessory-access-sys = { path = "crates/accessory-access-sys", version = "0.1.0" }
apple-bridge-build = { path = "crates/apple-bridge-build", version = "0.1.0" }
apple-bridge-foundation = { path = "crates/apple-bridge-foundation", version = "0.1.0" }
disk-image-kit = { path = "crates/disk-image-kit", version = "0.1.0" }
disk-image-kit-sys = { path = "crates/disk-image-kit-sys", version = "0.1.0" }
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
io-usb-host = { path = "crates/io-usb-host", version = "0.1.0" }
io-usb-host-sys = { path = "crates/io-usb-host-sys", version = "0.1.0" }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSScreen"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSFileHandle",
  "NSNull",
  "NSObject",
  "NSRange",
  "NSString",
  "NSURL",
  "NSUUID",
  "NSValue",
] }
swift-bridge = "0.1.59"
swift-bridge-build = "0.1.59"
url = "2"
uuid = { version = "1", default-features = false }
virtualization = { path = "crates/virtualization", version = "0.1.0" }
virtualization-sys = { path = "crates/virtualization-sys", version = "0.1.0" }
vmnet-framework = { path = "crates/vmnet-framework", version = "0.1.0" }
vmnet-framework-sys = { path = "crates/vmnet-framework-sys", version = "0.1.0" }
