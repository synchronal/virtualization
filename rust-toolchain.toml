# The rustup-side twin of `.tool-versions`, for anyone building without asdf.
# `rust-version` in Cargo.toml is a floor; this is the toolchain the crates are
# developed and tested against.
[toolchain]
channel = "1.98.1"
# Linux is only checked, never run: `virtualization` must compile off macOS.
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
